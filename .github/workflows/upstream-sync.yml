name: upstream-sync

# 上游 taste-skill 一有更新，就自动重新封装并开 PR。
# --check 会比对：上游 commit、本地打包内容的 treeHash、目录集合。
# 无漂移时 --check 退出 0，本工作流安静结束。

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.check.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 比对上游
        id: check
        continue-on-error: true
        run: node scripts/vendor.mjs --check

  resync:
    needs: check
    if: needs.check.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 记录上游旧 commit
        id: before
        run: echo "commit=$(node -p "require('./upstream.lock.json').sources[0].commit" 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: 重新封装
        run: node scripts/vendor.mjs

      - name: 递增 patch 版本
        id: bump
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            pkg.version = major + '.' + minor + '.' + (patch + 1);
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\n');
          "

      - name: 重新打包清单里的版本号
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            const m = JSON.parse(fs.readFileSync('skills/taste.manifest.json','utf8'));
            m.pluginVersion = pkg.version;
            m.generatedAt = new Date().toISOString();
            fs.writeFileSync('skills/taste.manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: 自检（打包后必须无漂移）
        run: node scripts/vendor.mjs --check

      - name: 推送分支并开 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          OLD_COMMIT: ${{ steps.before.outputs.commit }}
        run: |
          set -euo pipefail
          NEW_COMMIT=$(node -p "require('./upstream.lock.json').sources[0].commit")
          SHORT=$(echo "$NEW_COMMIT" | cut -c1-8)
          BRANCH="upstream-sync/$SHORT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "重新封装后没有改动，结束。"
            exit 0
          fi
          git commit -m "chore: re-vendor taste-skill ${OLD_COMMIT:0:8} -> $SHORT (v${NEW_VERSION})"

          # 幂等：同一上游 commit 的分支可能已经存在（前一次运行推过），
          # 强制更新而不是让 push 因非快进而失败。
          git push --force -u origin "$BRANCH"

          # 已经是开的 PR 就不再重复创建
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "已存在 PR，分支已更新，不重复创建。"
            exit 0
          fi

          gh pr create \
            --title "chore: 上游 taste-skill 更新 ${OLD_COMMIT:0:8} → $SHORT" \
            --body "自动重新封装。

          - 上游：\`${OLD_COMMIT}\` → \`${NEW_COMMIT}\`
          - 插件版本：v${NEW_VERSION}
          - \`skills/\` 由 \`scripts/vendor.mjs\` 重建，并已通过 \`--check\`

          合并后请发新版（打 tag 或 \`npm publish\`）。" \
            --base main --head "$BRANCH"
